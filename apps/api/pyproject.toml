[project]
name = "kira"
version = "0.1.0"
description = "Kira — AI money butler"
requires-python = ">=3.12,<4.0"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic[email]>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pyjwt>=2.10",
  # Named outright now that kira.adapters.osrm imports it at runtime, rather
  # than relying on the OpenAI SDK to keep dragging it in.
  "httpx>=0.28",
  "argon2-cffi>=23.1",
  "python-multipart>=0.0.17",
  "langgraph>=1.0",
  "langchain-core>=1.0",
  "langchain-openai>=1.0",
  "langgraph-checkpoint-postgres>=3.0",
  "psycopg[binary,pool]>=3.2",
  "apscheduler>=3.11,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.28",
  "aiosqlite>=0.20",
  "import-linter>=2.1",
  "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kira*"]

# setuptools ships no non-Python file unless it is named here, and the Docker
# image pip-installs this package. Without it the installed copy carries no
# place data at all and raises the moment kira.adapters.fakes is imported.
[tool.setuptools.package-data]
"kira.adapters" = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:kira.*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.importlinter]
root_package = "kira"

[[tool.importlinter.contracts]]
name = "engine is pure"
type = "forbidden"
source_modules = ["kira.engine"]
forbidden_modules = ["kira.api", "kira.services", "kira.adapters", "kira.db", "kira.agent", "kira.seed"]

[[tool.importlinter.contracts]]
name = "the agent never reaches back into the API"
type = "forbidden"
source_modules = ["kira.agent"]
forbidden_modules = ["kira.api"]

[[tool.importlinter.contracts]]
name = "layers point one way"
type = "layers"
layers = ["(kira.api)", "(kira.agent)", "(kira.services)", "kira.engine"]
