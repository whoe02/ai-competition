services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kira
      POSTGRES_PASSWORD: kira
      POSTGRES_DB: kira
    ports:
      - "5432:5432"
    volumes:
      - kira-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kira -d kira"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://kira:kira@db:5432/kira
      JWT_SECRET: ${JWT_SECRET:-development-only-replace-with-a-secure-jwt-secret}
      DEMO_TODAY: "2026-09-03"
      SEED_DEMO: "1"
      # Unset means the Butler runs on its offline model: the graph, the tools,
      # the approvals and the evidence are identical, only the prose differs.
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      BUTLER_MODEL: ${BUTLER_MODEL:-qwen-plus}
      # Road distances for the day planner. Off, or with the router unreachable
      # from the venue, every place comes back labelled "straight line" and the
      # screen says so rather than quoting a fare it cannot stand behind.
      ROUTING_ENABLED: ${ROUTING_ENABLED:-true}
      OSRM_BASE_URL: ${OSRM_BASE_URL:-https://router.project-osrm.org}
      ROUTING_TIMEOUT_SECONDS: ${ROUTING_TIMEOUT_SECONDS:-2.5}
    ports:
      - "${KIRA_PORT:-8001}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    build: .
    command: ["python", "-m", "kira.worker"]
    depends_on:
      app:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://kira:kira@db:5432/kira
      DEMO_TODAY: "2026-09-03"
      WORKER_TIMEZONE: Asia/Kuala_Lumpur
      WORKER_HOUR: "5"
      WORKER_MINUTE: "0"

volumes:
  kira-db:
